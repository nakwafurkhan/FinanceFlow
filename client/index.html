<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Brand identity -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#6366f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1e1b4b" media="(prefers-color-scheme: dark)" />

    <!-- SEO -->
    <title>FinanceFlow — Personal Finance Made Beautiful</title>
    <meta
      name="description"
      content="An Apple-inspired personal finance dashboard. Track expenses, manage monthly budgets, visualise spending with smart analytics, and get AI-powered insights. MERN-stack, dark mode, installable PWA."
    />
    <meta name="author" content="Nakwa Furkhan" />
    <meta
      name="keywords"
      content="personal finance, budget tracker, expense tracker, MERN, dashboard, analytics, AI, PWA"
    />

    <!-- Open Graph / social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="FinanceFlow — Personal Finance Made Beautiful" />
    <meta
      property="og:description"
      content="Track expenses, manage budgets, and visualise your money with an Apple-inspired MERN-stack dashboard — now with AI insights."
    />
    <meta property="og:url" content="https://finance-flow-theta-indol.vercel.app" />
    <meta property="og:image" content="/og-image.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FinanceFlow — Personal Finance Made Beautiful" />
    <meta
      name="twitter:description"
      content="Track expenses, manage budgets, and visualise your money with an Apple-inspired MERN-stack dashboard — now with AI insights."
    />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- Performance: preconnect to font + backend so first paint and first API call are faster -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://financeflow-6xau.onrender.com" />
    <link rel="dns-prefetch" href="https://financeflow-6xau.onrender.com" />

    <!-- Typography — Inter (UI, 3 weights) + Instrument Serif (editorial italic
         accent used on the landing headlines). Instrument Serif was added for
         the redesign; the app previously had no serif face. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
